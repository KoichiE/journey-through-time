
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="HISTORY QUEST - Journey Through Time. An interactive historical adventure game.">

    <title>HISTORY QUEST | Journey Through Time</title>

    <!-- Pixel Art Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Game Container -->
    <main id="game-container">

        <!-- Welcome Screen -->
        <section id="welcome-screen" class="screen active">

            <div class="game-logo">
                <h1>HISTORY QUEST</h1>
                <p class="subtitle">JOURNEY THROUGH TIME</p>
            </div>

            <div class="welcome-content">
                <p class="intro-text">
                    Every historical event has a story.
                    Are you ready to discover yours?
                </p>

                <div class="menu-buttons">
                    <button id="new-game-btn" class="game-button">
                        NEW GAME
                    </button>

                    <button id="continue-btn" class="game-button">
                        CONTINUE
                    </button>

                    <button id="settings-btn" class="game-button">
                        SETTINGS
                    </button>
                </div>
            </div>

            <footer class="game-footer">
                <p>AN EDUCATIONAL ADVENTURE THROUGH HISTORY</p>
                <p>© 2026 HISTORY QUEST</p>
            </footer>

        </section>

        <!-- Future Screens -->

        <section id="world-selection-screen" class="screen">
            <!-- World History and US History selection -->
        </section>

        <section id="game-screen" class="screen">
            <!-- Main gameplay area -->
        </section>

        <section id="settings-screen" class="screen">
            <!-- Game settings -->
        </section>

    </main>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
