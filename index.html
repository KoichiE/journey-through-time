
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="HISTORY QUEST - Journey Through Time">

    <title>HISTORY QUEST | Journey Through Time</title>

    <!-- Pixel Art Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game-container">

        <!-- Main Menu -->
        <section id="welcome-screen" class="screen active">

            <div class="logo">
                <span class="logo-icon">⌛</span>
                <h1>HISTORY<br>QUEST</h1>
                <p>JOURNEY THROUGH TIME</p>
            </div>

            <div class="menu-content">

                <p class="welcome-message">
                    THE PAST IS WAITING FOR YOU.
                    <br>
                    ARE YOU READY TO EXPLORE?
                </p>

                <div class="menu-buttons">
                    <button id="new-game-btn" class="game-button">
                        NEW GAME
                    </button>

                    <button id="continue-btn" class="game-button">
                        CONTINUE
                    </button>

                    <button id="settings-btn" class="game-button">
                        SETTINGS
                    </button>
                </div>

            </div>

            <footer>
                <p>AN EDUCATIONAL ADVENTURE THROUGH HISTORY</p>
                <p>© 2026 HISTORY QUEST</p>
            </footer>

        </section>

        <!-- Future Game Screens -->

        <section id="world-selection-screen" class="screen">
        </section>

        <section id="game-screen" class="screen">
        </section>

        <section id="results-screen" class="screen">
        </section>

        <section id="settings-screen" class="screen">
        </section>

    </main>

    <!-- JavaScript -->
    <script src="actions.js"></script>

</body>
</html>
